server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    etag on;

    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/geo+json
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/javascript;

    include /etc/nginx/snippets/security-headers.conf;

    # Excel preview and synchronization can legitimately take several minutes.
    location ~ ^/api/data-uploads/(?:preview|[0-9]+/sync)$ {
        proxy_pass http://backend:8080;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # PMTiles and supporting map resources are served by Nginx itself. Nginx's
    # static module handles byte ranges and returns 206/Content-Range responses.
    location ^~ /tiles/ {
        try_files $uri =404;
        default_type application/octet-stream;
        gzip off;
        max_ranges 1;
        add_header Accept-Ranges "bytes" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite emits content-hashed files under /assets/.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Expires "0" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The canonical methodology seed belongs to the backend JAR and must never
    # fall through to the SPA as if it were still a public JSON asset.
    location = /methodology/methodology-data.json {
        return 404;
    }

    # This public analysis shell is not content-hashed. Revalidate it on every
    # visit and let Nginx's ETag avoid retransmitting unchanged HTML.
    location = /core-marker-priority/index.html {
        try_files $uri =404;
        etag on;
        add_header Cache-Control "public, no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The vendored chart runtime changes rarely but has a stable filename, so a
    # bounded cache lifetime is safer than immutable caching.
    location ^~ /core-marker-priority/_assets/ {
        try_files $uri =404;
        etag on;
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # This Vue route shares its name with an embedded static prototype folder.
    location = /core-marker-priority {
        try_files "" /index.html;
    }

    # Keep the production ICD11 Vue route refresh-safe even if a same-named
    # static directory is added in a future release.
    location = /icd11-sankey {
        try_files "" /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
